<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>关闭确认</title>
<style>
  /* DeepSeek Harness 风格：暗色为默认，亮色跟随系统 prefers-color-scheme。
     色值取自 DSH 设计令牌（bluish / deepseek / red 色阶）。 */
  :root {
    --bg-base: #151517;
    --bg-hover: rgba(255, 255, 255, 0.08);
    --bg-active: rgba(255, 255, 255, 0.14);
    --border-l2: rgba(255, 255, 255, 0.12);
    --label-primary: #f9fafb;
    --label-secondary: #81858c;
    --label-tertiary: #6b6f76;
    --danger: #f25a5a;
    --danger-border: rgba(242, 90, 90, 0.4);
    --danger-hover: rgba(242, 90, 90, 0.12);
    --danger-active: rgba(242, 90, 90, 0.2);
    --primary-bg: #f9fafb;
    --primary-bg-hover: #ebecf2;
    --primary-bg-active: #e1e5ee;
    --primary-text: #0f1115;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg-base: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.06);
      --bg-active: rgba(0, 0, 0, 0.1);
      --border-l2: rgba(0, 0, 0, 0.12);
      --label-primary: #0f1115;
      --label-secondary: #61666b;
      --label-tertiary: #9aa0a6;
      --danger: #ec1313;
      --danger-border: rgba(236, 19, 19, 0.35);
      --danger-hover: rgba(236, 19, 19, 0.08);
      --danger-active: rgba(236, 19, 19, 0.14);
      --primary-bg: #0f1115;
      --primary-bg-hover: #2a2d33;
      --primary-bg-active: #3a3e46;
      --primary-text: #ffffff;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-base);
    color: var(--label-primary);
    overflow: hidden;
  }
  .card {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg-base);
  }
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 20px 0;
    -webkit-app-region: drag;
  }
  .head img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    -webkit-app-region: no-drag;
  }
  .wordmark {
    font-size: 13px;
    line-height: 20px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--label-secondary);
  }
  .body { padding: 16px 20px 0; }
  .title { font-size: 15px; line-height: 22px; font-weight: 600; }
  .desc { margin-top: 6px; font-size: 13px; line-height: 20px; color: var(--label-secondary); }
  .hint { margin-top: 10px; font-size: 12px; line-height: 18px; color: var(--label-tertiary); }
  .hint b { color: var(--label-primary); font-weight: 500; }
  .footer {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 18px;
    border-top: 1px solid var(--border-l2);
  }
  .btn {
    height: 34px;
    padding: 0 18px;
    border-radius: 18px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--label-primary);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  .btn:focus-visible { outline: 2px solid rgba(86, 134, 254, 0.6); outline-offset: 1px; }
  .btn-ghost { border-color: var(--border-l2); }
  .btn-ghost:hover { background: var(--bg-hover); }
  .btn-ghost:active { background: var(--bg-active); }
  .btn-danger { color: var(--danger); border-color: var(--danger-border); }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-danger:active { background: var(--danger-active); }
  .btn-primary { background: var(--primary-bg); color: var(--primary-text); font-weight: 600; }
  .btn-primary:hover { background: var(--primary-bg-hover); }
  .btn-primary:active { background: var(--primary-bg-active); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <img id="appIcon" alt="" draggable="false">
      <span class="wordmark">DEEPSEEK HARNESS DESKTOP</span>
    </div>
    <div class="body">
      <div class="title">要关闭主窗口吗？</div>
      <div class="desc">应用可以隐藏到系统托盘继续在后台运行，也可以直接退出。</div>
      <div class="hint">隐藏到托盘后任务栏图标会消失，后端服务继续运行；点击<b>系统托盘图标</b>即可恢复窗口。</div>
    </div>
    <div class="footer">
      <button class="btn btn-ghost" id="cancel">取消</button>
      <button class="btn btn-danger" id="quit">直接退出</button>
      <button class="btn btn-primary" id="tray">隐藏到托盘</button>
    </div>
  </div>
  <script>
    const { dshCloseDialog } = window
    // 图标经 preload/IPC 获取（base64 走 URL 查询串会被 '+' 解码损坏）
    if (dshCloseDialog) {
      dshCloseDialog.getIcon().then((uri) => {
        if (uri) document.getElementById('appIcon').src = uri
      })
    }
    const choose = (action) => { if (dshCloseDialog) dshCloseDialog.choose(action) }
    document.getElementById('cancel').addEventListener('click', () => choose('cancel'))
    document.getElementById('quit').addEventListener('click', () => choose('quit'))
    document.getElementById('tray').addEventListener('click', () => choose('tray'))
    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') choose('cancel')
      else if (event.key === 'Enter') choose('tray')
    })
  </script>
</body>
</html>
